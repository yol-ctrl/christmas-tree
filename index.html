<script type="module">
import * as THREE from 'three';
// ===== 音乐控制 =====
const bgm = document.getElementById('bgm');
const musicHint = document.getElementById('music-hint');
let musicStarted = false;

// 开场动画结束后显示音乐提示（5.5秒后）
setTimeout(() => { musicHint.style.opacity = '1'; }, 5500);

function tryPlayMusic() {
    if (musicStarted) return;
    bgm.play().then(() => {
        musicStarted = true;
        musicHint.style.opacity = '0';
    }).catch(() => {});
}
document.addEventListener('click', tryPlayMusic);
document.addEventListener('touchstart', tryPlayMusic, { passive: true });
/* ========== 缓动 ========== */
const easeOutCubic  = t => 1 - Math.pow(1 - t, 3);
const easeInOutQuad = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeInCubic   = t => t * t * t;

/* ========== 0. 基础环境 ========== */
const isMobile = /Mobi|Android|iPhone|iPad|iPod|HarmonyOS/i.test(navigator.userAgent);

const scene = new THREE.Scene();

scene.add(new THREE.AmbientLight(0x8fa8d8, 1.15));
const keyLight = new THREE.DirectionalLight(0xfff2e2, 1.5);
keyLight.position.set(8, 16, 10);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0x6f9bff, 0.7);
fillLight.position.set(-10, 6, -8);
scene.add(fillLight);

scene.fog = new THREE.FogExp2(0x060e1f, 0.009);

const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 600);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true,
    powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const PR = renderer.getPixelRatio();
const timeUniform = { value: 0 };

/* ========== 1. 贴图 ========== */
function makeCircleTexture() {
    const s = 64;
    const c = document.createElement('canvas');
    c.width = c.height = s;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.4, 'rgba(255,255,255,0.85)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, s, s);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
}
const circleTex = makeCircleTexture();

function makeStarTexture() {
    const s = 256;
    const c = document.createElement('canvas');
    c.width = c.height = s;
    const ctx = c.getContext('2d');
    const cx = s/2, cy = s/2;

    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, s/2);
    g.addColorStop(0.00, 'rgba(255,255,255,1)');
    g.addColorStop(0.10, 'rgba(235,248,255,0.95)');
    g.addColorStop(0.28, 'rgba(155,215,255,0.45)');
    g.addColorStop(0.60, 'rgba(85,155,255,0.10)');
    g.addColorStop(1.00, 'rgba(40,100,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, s, s);

    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 4; i++) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(i * Math.PI / 2);
        const lg = ctx.createLinearGradient(0, 0, s * 0.5, 0);
        lg.addColorStop(0.00, 'rgba(255,255,255,0.9)');
        lg.addColorStop(0.18, 'rgba(210,240,255,0.5)');
        lg.addColorStop(0.55, 'rgba(140,200,255,0.08)');
        lg.addColorStop(1.00, 'rgba(100,170,255,0)');
        ctx.fillStyle = lg;
        ctx.beginPath();
        ctx.moveTo(0, -7);
        ctx.lineTo(s * 0.5, 0);
        ctx.lineTo(0, 7);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
}
const starTex = makeStarTexture();

/* ========== 2. 树的几何参数 ========== */
const BASE_Y      = -5;
const TREE_HEIGHT = 20;
const BASE_RADIUS = 7.5;
const SPIRALS     = 5;
const TURNS       = 8;

const TRUNK_HEIGHT    = 2.6;
const TRUNK_RADIUS    = 0.75;
const TRUNK_BOTTOM_Y  = BASE_Y - TRUNK_HEIGHT;
const STAR_Y          = BASE_Y + TREE_HEIGHT + 1.3;

/* ========== 3. 粒子着色器 ========== */
const particleVert = /* glsl */`
    attribute vec3  aColor;
    attribute float aPhase;
    attribute float aSize;
    attribute float aTwinkle;

    uniform float uTime;
    uniform float uPixelRatio;

    varying vec3  vColor;
    varying float vAlpha;

    void main() {
        vColor = aColor;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);

        float s  = 0.5 + 0.5 * sin(uTime * 2.4 + aPhase);
        float tw = mix(1.0, 0.18 + 1.05 * s, aTwinkle);
        vAlpha   = clamp(tw, 0.0, 1.0);

        float size = aSize * uPixelRatio * (0.65 + 0.35 * s) * (110.0 / -mv.z);
        gl_PointSize = min(size, 60.0);
        gl_Position  = projectionMatrix * mv;
    }
`;

const particleFrag = /* glsl */`
    varying vec3  vColor;
    varying float vAlpha;

    void main() {
        vec2 uv = gl_PointCoord - 0.5;
        float d = length(uv);
        if (d > 0.5) discard;
        float a = smoothstep(0.5, 0.05, d);
        gl_FragColor = vec4(vColor, a * vAlpha);
        #include <colorspace_fragment>
    }
`;

const particleMaterial = new THREE.ShaderMaterial({
    vertexShader:   particleVert,
    fragmentShader: particleFrag,
    uniforms: {
        uTime:       timeUniform,
        uPixelRatio: { value: PR },
    },
    transparent: true,
    depthWrite:  false,
    blending:    THREE.AdditiveBlending,
});

function buildGeometry(posArr, colArr, phaseArr, sizeArr, twArr) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
    g.setAttribute('aColor',   new THREE.BufferAttribute(colArr, 3));
    g.setAttribute('aPhase',   new THREE.BufferAttribute(phaseArr, 1));
    g.setAttribute('aSize',    new THREE.BufferAttribute(sizeArr, 1));
    g.setAttribute('aTwinkle', new THREE.BufferAttribute(twArr, 1));
    return g;
}

/* ========== 4. 树主体 Group ========== */
const treeGroup = new THREE.Group();
scene.add(treeGroup);

/* ========== 5. 树叶粒子 ========== */
const FOLIAGE_COUNT = isMobile ? 5500 : 9000;

const fPos = new Float32Array(FOLIAGE_COUNT * 3);
const fCol = new Float32Array(FOLIAGE_COUNT * 3);
const fPha = new Float32Array(FOLIAGE_COUNT);
const fSiz = new Float32Array(FOLIAGE_COUNT);
const fTwi = new Float32Array(FOLIAGE_COUNT);

const colLow  = new THREE.Color(0x0a1a3a);
const colMid  = new THREE.Color(0x3a7bd5);
const colHigh = new THREE.Color(0xcfe6ff);
const colAcc  = new THREE.Color(0xffffff);
const colAcc2 = new THREE.Color(0x7ee8fa);
const tmpColor = new THREE.Color();

for (let i = 0; i < FOLIAGE_COUNT; i++) {
    const onSpiral = Math.random() < 0.66;
    let t, angle;

    if (onSpiral) {
        t = Math.pow(Math.random(), 0.9);
        const idx   = Math.floor(Math.random() * SPIRALS);
        const shift = (idx / SPIRALS) * Math.PI * 2;
        angle = t * TURNS * Math.PI * 2 + shift + (Math.random() - 0.5) * 0.28;
    } else {
        t = Math.pow(Math.random(), 0.85);
        angle = Math.random() * Math.PI * 2;
    }

    const y = BASE_Y + t * TREE_HEIGHT;
    const radiusAtT = BASE_RADIUS * Math.pow(1 - t, 1.06);

    let r;
    if (onSpiral) {
        r = radiusAtT * (0.90 + Math.random() * 0.14);
    } else {
        r = radiusAtT * Math.sqrt(Math.random()) * 1.02;
    }
    if (t > 0.95) r *= 0.45;

    fPos[i*3]     = Math.cos(angle) * r;
    fPos[i*3 + 1] = y + (Math.random() - 0.5) * 0.4;
    fPos[i*3 + 2] = Math.sin(angle) * r;

    if (t < 0.5) {
        tmpColor.copy(colLow).lerp(colMid, t / 0.5);
    } else {
        tmpColor.copy(colMid).lerp(colHigh, (t - 0.5) / 0.5);
    }
    const rnd = Math.random();
    if (rnd < 0.05) tmpColor.lerp(colAcc, 0.85);
    else if (rnd < 0.09) tmpColor.lerp(colAcc2, 0.75);

    tmpColor.multiplyScalar(0.55 + Math.random() * 0.45);

    fCol[i*3]     = tmpColor.r;
    fCol[i*3 + 1] = tmpColor.g;
    fCol[i*3 + 2] = tmpColor.b;

    fPha[i] = Math.random() * Math.PI * 2;
    fSiz[i] = 0.85 + Math.random() * 1.15;
    fTwi[i] = 0.12;
}

treeGroup.add(new THREE.Points(
    buildGeometry(fPos, fCol, fPha, fSiz, fTwi),
    particleMaterial
));

/* ========== 6. 彩灯 ========== */
const LIGHT_COUNT = isMobile ? 160 : 280;

const lPos = new Float32Array(LIGHT_COUNT * 3);
const lCol = new Float32Array(LIGHT_COUNT * 3);
const lPha = new Float32Array(LIGHT_COUNT);
const lSiz = new Float32Array(LIGHT_COUNT);
const lTwi = new Float32Array(LIGHT_COUNT);

const LIGHT_PALETTE = [
    0xffffff, 0x88ddff, 0x4aa8ff, 0xa0f0e8,
    0xd0e8ff, 0xe8f4ff, 0x2a6fdb, 0x2ef2cf,
];

for (let i = 0; i < LIGHT_COUNT; i++) {
    const t = Math.pow(Math.random(), 0.82);
    const y = BASE_Y + t * TREE_HEIGHT * 0.97;

    const radiusAtT = BASE_RADIUS * Math.pow(1 - t, 1.06);
    const idx   = Math.floor(Math.random() * SPIRALS);
    const shift = (idx / SPIRALS) * Math.PI * 2;
    const angle = t * TURNS * Math.PI * 2 + shift + (Math.random() - 0.5) * 0.18;
    const r     = radiusAtT * (0.97 + Math.random() * 0.10);

    lPos[i*3]     = Math.cos(angle) * r;
    lPos[i*3 + 1] = y;
    lPos[i*3 + 2] = Math.sin(angle) * r;

    tmpColor.setHex(LIGHT_PALETTE[Math.floor(Math.random() * LIGHT_PALETTE.length)]);
    lCol[i*3]     = tmpColor.r;
    lCol[i*3 + 1] = tmpColor.g;
    lCol[i*3 + 2] = tmpColor.b;

    lPha[i] = Math.random() * Math.PI * 2;
    lSiz[i] = 2.6 + Math.random() * 2.4;
    lTwi[i] = 1.0;
}

treeGroup.add(new THREE.Points(
    buildGeometry(lPos, lCol, lPha, lSiz, lTwi),
    particleMaterial
));

/* ========== 6.5 青绿色星尘瀑布 ========== */
const BAND_COUNT = 2;
const POINTS_PER_BAND = isMobile ? 400 : 800;
const bandTotalCount = BAND_COUNT * POINTS_PER_BAND;

const bandPos = new Float32Array(bandTotalCount * 3);
const bandCol = new Float32Array(bandTotalCount * 3);
const bandPhase = new Float32Array(bandTotalCount);
const bandOffset = new Float32Array(bandTotalCount);

const CYAN_GREEN_COLORS = [0x00ffff, 0x2ef2cf, 0x00ffaa, 0xa0f0e8];

for (let b = 0; b < BAND_COUNT; b++) {
    const shift = (b / BAND_COUNT) * Math.PI * 2;
    for (let i = 0; i < POINTS_PER_BAND; i++) {
        const idx = b * POINTS_PER_BAND + i;
        bandPos[idx*3] = 0;
        bandPos[idx*3+1] = 0;
        bandPos[idx*3+2] = 0;
        if (Math.random() < 0.85) {
            tmpColor.setHex(CYAN_GREEN_COLORS[Math.floor(Math.random() * CYAN_GREEN_COLORS.length)]);
        } else {
            tmpColor.setHex(0x00ffcc);
        }
        tmpColor.multiplyScalar(2.5);
        bandCol[idx*3] = tmpColor.r;
        bandCol[idx*3+1] = tmpColor.g;
        bandCol[idx*3+2] = tmpColor.b;
        bandPhase[idx] = shift + (Math.random() - 0.5) * 0.15;
        bandOffset[idx] = Math.random();
    }
}

const bandGeo = new THREE.BufferGeometry();
bandGeo.setAttribute('position', new THREE.BufferAttribute(bandPos, 3));
bandGeo.setAttribute('aColor', new THREE.BufferAttribute(bandCol, 3));
bandGeo.setAttribute('aPhase', new THREE.BufferAttribute(bandPhase, 1));
bandGeo.setAttribute('aOffset', new THREE.BufferAttribute(bandOffset, 1));

const bandVert = /* glsl */`
    attribute vec3 aColor;
    attribute float aPhase;
    attribute float aOffset;

    uniform float uTime;
    uniform float uPixelRatio;
    uniform float uBaseY;
    uniform float uStarY;
    uniform float uBaseRadius;

    varying vec3 vColor;
    varying float vAlpha;

    void main() {
        vColor = aColor;
        float speed = 0.015;
        float p = fract(1.0 - (uTime * speed + aOffset));
        float y = mix(uBaseY, uStarY, p);
        float r = 0.5 + (uBaseRadius + 4.0) * pow(1.0 - p, 1.06);
        float angle = p * 6.0 * 3.14159 * 2.0 + aPhase;
        vec3 pos = vec3(cos(angle) * r, y, sin(angle) * r);
        float fadeTop = smoothstep(1.0, 0.95, p);
        float fadeBottom = smoothstep(0.0, 0.1, p);
        float twinkle = 0.6 + 0.4 * sin(uTime * 5.0 + aPhase * 20.0);
        vAlpha = fadeTop * fadeBottom * twinkle;
        vec4 mv = modelViewMatrix * vec4(pos, 1.0);
        gl_PointSize = 2.2 * uPixelRatio * (110.0 / -mv.z);
        gl_Position = projectionMatrix * mv;
    }
`;

const bandMat = new THREE.ShaderMaterial({
    vertexShader: bandVert,
    fragmentShader: particleFrag,
    uniforms: {
        uTime: timeUniform,
        uPixelRatio: { value: PR },
        uBaseY: { value: BASE_Y },
        uStarY: { value: STAR_Y },
        uBaseRadius: { value: BASE_RADIUS }
    },
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
});

const bandPoints = new THREE.Points(bandGeo, bandMat);

/* ========== 6.7 烟花系统 ========== */
const FIREWORK_MAX = isMobile ? 5 : 9;
const FIREWORK_PARTICLES = isMobile ? 120 : 200;
const FIREWORK_PALETTE = [
    0xffffff, 0xffffff, 0x88ccff,
    0x4488ff, 0x0044ff, 0xffff00,
    0xffdd00, 0xffffff
];

class Firework {
    constructor() {
        this.active = false;
        this.state = 'idle';
        this.x = 0; this.y = 0; this.z = 0;
        this.vx = 0; this.vy = 0; this.vz = 0;
        this.targetY = 0;
        this.color = new THREE.Color();
        this.particles = [];
        this.timer = 0;
    }

    launch() {
        const side = Math.random() < 0.5 ? -1 : 1;
        this.x = side * (BASE_RADIUS * 1.5 + Math.random() * 4);
        this.y = TREE_HEIGHT * 0.8 + BASE_Y;
        this.z = (Math.random() - 0.5) * 6;
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = 18 + Math.random() * 8;
        this.vz = (Math.random() - 0.5) * 2;
        this.targetY = STAR_Y + 3 + Math.random() * 8;
        this.color.setHex(FIREWORK_PALETTE[Math.floor(Math.random() * FIREWORK_PALETTE.length)]);
        this.active = true;
        this.state = 'rising';
        this.timer = 0;
        this.particles = [];
    }

    update(dt) {
        if (!this.active) return;

        if (this.state === 'rising') {
            this.x += this.vx * dt;
            this.y += this.vy * dt;
            this.z += this.vz * dt;
            this.vy -= 12 * dt;

            if (this.vy <= 0 || this.y >= this.targetY) {
                this.explode();
            }
        } else if (this.state === 'exploding') {
            this.timer += dt;
            for (let p of this.particles) {
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.z += p.vz * dt;
                p.vy -= 8 * dt;
                p.life -= dt;
            }
            this.particles = this.particles.filter(p => p.life > 0);
            if (this.particles.length === 0) {
                this.active = false;
                this.state = 'idle';
            }
        }
    }

    explode() {
        this.state = 'exploding';
        this.timer = 0;
        const whiteMix = Math.random() * 0.3;
        const baseColor = new THREE.Color().copy(this.color).lerp(new THREE.Color(0xffffff), whiteMix);

        for (let i = 0; i < FIREWORK_PARTICLES; i++) {
            const speed = 6.0 + Math.random() * 10.0;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            this.particles.push({
                x: this.x, y: this.y, z: this.z,
                vx: speed * Math.sin(phi) * Math.cos(theta),
                vy: speed * Math.sin(phi) * Math.sin(theta),
                vz: speed * Math.cos(phi),
                life: 1.5 + Math.random() * 1.0,
                size: 2.2 + Math.random() * 3.0,
                color: new THREE.Color().copy(baseColor)
            });
        }
    }
}

const fireworks = [];
for (let i = 0; i < FIREWORK_MAX; i++) {
    fireworks.push(new Firework());
}

let fireworkTimer = 0;
let fireworkActive = false;

function updateFireworks(dt) {
    if (!fireworkActive) return;

    fireworkTimer += dt;
    if (fireworkTimer > 1.2) {
        fireworkTimer = 0;
        const idle = fireworks.find(f => !f.active);
        if (idle) idle.launch();
    }

    for (let f of fireworks) {
        f.update(dt);
    }
}

const fwGeo = new THREE.BufferGeometry();
const fwMaxParticles = FIREWORK_MAX * FIREWORK_PARTICLES;
const fwPosArr = new Float32Array(fwMaxParticles * 3);
const fwColArr = new Float32Array(fwMaxParticles * 3);
const fwSizeArr = new Float32Array(fwMaxParticles);
const fwAlphaArr = new Float32Array(fwMaxParticles);

fwGeo.setAttribute('position', new THREE.BufferAttribute(fwPosArr, 3));
fwGeo.setAttribute('aColor', new THREE.BufferAttribute(fwColArr, 3));
fwGeo.setAttribute('aSize', new THREE.BufferAttribute(fwSizeArr, 1));
fwGeo.setAttribute('aAlpha', new THREE.BufferAttribute(fwAlphaArr, 1));

const fwMat = new THREE.ShaderMaterial({
    vertexShader: /* glsl */`
        attribute vec3 aColor;
        attribute float aSize;
        attribute float aAlpha;
        uniform float uPixelRatio;
        varying vec3 vColor;
        varying float vAlpha;
        void main() {
            vColor = aColor;
            vAlpha = aAlpha;
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            gl_PointSize = aSize * uPixelRatio * (110.0 / -mv.z);
            gl_Position = projectionMatrix * mv;
        }
    `,
    fragmentShader: /* glsl */`
        varying vec3 vColor;
        varying float vAlpha;
        void main() {
            vec2 uv = gl_PointCoord - 0.5;
            float d = length(uv);
            if (d > 0.5) discard;
            float a = smoothstep(0.5, 0.05, d);
            gl_FragColor = vec4(vColor, a * vAlpha);
            #include <colorspace_fragment>
        }
    `,
    uniforms: { uPixelRatio: { value: PR } },
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
});

const fireworkPoints = new THREE.Points(fwGeo, fwMat);
fireworkPoints.frustumCulled = false;
scene.add(fireworkPoints);

function renderFireworks() {
    let idx = 0;
    for (let f of fireworks) {
        if (!f.active) continue;

        if (f.state === 'rising') {
            if (idx < fwMaxParticles) {
                fwPosArr[idx*3] = f.x;
                fwPosArr[idx*3+1] = f.y;
                fwPosArr[idx*3+2] = f.z;
                fwColArr[idx*3] = f.color.r;
                fwColArr[idx*3+1] = f.color.g;
                fwColArr[idx*3+2] = f.color.b;
                fwSizeArr[idx] = 4.0;
                fwAlphaArr[idx] = 1.0;
                idx++;
            }
        } else if (f.state === 'exploding') {
            for (let p of f.particles) {
                if (idx >= fwMaxParticles) break;
                fwPosArr[idx*3] = p.x;
                fwPosArr[idx*3+1] = p.y;
                fwPosArr[idx*3+2] = p.z;
                fwColArr[idx*3] = p.color.r;
                fwColArr[idx*3+1] = p.color.g;
                fwColArr[idx*3+2] = p.color.b;
                fwSizeArr[idx] = p.size;
                fwAlphaArr[idx] = Math.max(0, p.life / 2.5);
                idx++;
            }
        }
    }
    for (let i = idx; i < fwMaxParticles; i++) {
        fwAlphaArr[i] = 0;
    }
    fwGeo.attributes.position.needsUpdate = true;
    fwGeo.attributes.aColor.needsUpdate = true;
    fwGeo.attributes.aSize.needsUpdate = true;
    fwGeo.attributes.aAlpha.needsUpdate = true;
}

const giftBoxes = [];

function makeBoxMesh(w, h, d) {
    const geo = new THREE.BoxGeometry(w, h, d, 6, 4, 6);
    const pos = geo.attributes.position;
    const v = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        const k = 1 + 0.035 * Math.sin(v.x * 3.1) * Math.sin(v.y * 2.7) * Math.sin(v.z * 3.4);
        v.multiplyScalar(k);
        pos.setXYZ(i, v.x, v.y, v.z);
    }
    geo.computeVertexNormals();

    return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
        color: 0xc2544f,
        roughness: 0.72,
        metalness: 0.04,
        emissive: 0x2a0d10,
        emissiveIntensity: 0.35,
    }));
}

function makeRibbon(w, h, d, t) {
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({
        color: 0xf2ede6,
        roughness: 0.55,
        metalness: 0.02,
        emissive: 0x3a3630,
        emissiveIntensity: 0.25,
    });
    const a = new THREE.Mesh(new THREE.BoxGeometry(t, h * 1.015, d * 1.015), mat);
    const b = new THREE.Mesh(new THREE.BoxGeometry(w * 1.015, h * 1.015, t), mat);
    const c = new THREE.Mesh(new THREE.BoxGeometry(w * 1.015, t * 1.6, d * 1.015), mat);
    g.add(a, b, c);
    return g;
}

function makeBow(scale) {
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({
        color: 0xeae3da,
        roughness: 0.5,
        metalness: 0.02,
        emissive: 0x3a3630,
        emissiveIntensity: 0.3,
    });
    const loopGeo = new THREE.TorusGeometry(0.34, 0.075, 8, 18, Math.PI * 1.35);
    const l1 = new THREE.Mesh(loopGeo, mat);
    const l2 = new THREE.Mesh(loopGeo, mat);
    l1.position.set(-0.34, 0.05, 0);
    l1.rotation.set(0, 0, Math.PI * 0.5 + 0.25);
    l2.position.set(0.34, 0.05, 0);
    l2.rotation.set(0, 0, Math.PI * 0.5 - 0.25);
    l2.scale.setScalar(-1);
    const knot = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), mat);
    knot.scale.set(1, 0.75, 1);
    const t1 = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.5, 0.04), mat);
    const t2 = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.42, 0.04), mat);
    t1.position.set(-0.1, -0.42, 0.05); t1.rotation.set(0.3, 0.2, 0.35);
    t2.position.set(0.12, -0.38, -0.04); t2.rotation.set(-0.2, -0.3, -0.3);
    g.add(l1, l2, knot, t1, t2);
    g.scale.setScalar(scale);
    return g;
}

const GIFT_COUNT = isMobile ? 18 : 36;

for (let i = 0; i < GIFT_COUNT; i++) {

function makeGroundTexture() {
    const s = 256;
    const c = document.createElement('canvas');
    c.width = c.height = s;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
    g.addColorStop(0.00, 'rgba(120,190,255,0.50)');
    g.addColorStop(0.25, 'rgba(50,120,220,0.24)');
    g.addColorStop(0.60, 'rgba(20,60,140,0.06)');
    g.addColorStop(1.00, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, s, s);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
}

snowGeo.setAttribute('aSpeed',   new THREE.BufferAttribute(sSpd, 1));
snowGeo.setAttribute('aPhase',   new THREE.BufferAttribute(sPha, 1));

const snowMat = new THREE.ShaderMaterial({
    uniforms: {
        uTime:       timeUniform,
        uPixelRatio: { value: PR },
    },
    vertexShader: /* glsl */`
        attribute float aSpeed;
        attribute float aPhase;
        uniform float uTime;
        uniform float uPixelRatio;
        varying float vAlpha;

        void main() {
            vec3 p = position;
            p.y = mod(p.y - uTime * aSpeed * 3.0, 55.0) - 8.0;
            p.x += sin(uTime * 0.55 + aPhase) * 2.2;
            p.z += cos(uTime * 0.48 + aPhase) * 2.2;

            vec4 mv = modelViewMatrix * vec4(p, 1.0);
            gl_PointSize = (1.6 + aSpeed * 1.1) * uPixelRatio * (95.0 / -mv.z);

        void main() {
            vec2 uv = gl_PointCoord - 0.5;
            float d = length(uv);
            if (d > 0.5) discard;
            float a = smoothstep(0.5, 0.1, d);
            gl_FragColor = vec4(0.86, 0.94, 1.0, a * vAlpha);

    transparent: true,
    depthWrite: false,

const snow = new THREE.Points(snowGeo, snowMat);

/* ========== 11. 星空 ========== */
const BG_COUNT = isMobile ? 500 : 850;

    const theta = Math.random() * Math.PI * 2;
    const phi   = Math.acos(2 * Math.random() - 1);

    bgPos[i*3]     = r * Math.sin(phi) * Math.cos(theta);
    bgPos[i*3 + 1] = r * Math.cos(phi) * 0.55 + 12;
    bgPos[i*3 + 2] = r * Math.sin(phi) * Math.sin(theta);

    const b = 0.25 + Math.random() * 0.75;
    bgCol[i*3]     = b * (0.72 + Math.random() * 0.28);
    bgCol[i*3 + 1] = b * (0.85 + Math.random() * 0.15);
    bgCol[i*3 + 2] = b;

bgGeo.setAttribute('position', new THREE.BufferAttribute(bgPos, 3));
bgGeo.setAttribute('color',    new THREE.BufferAttribute(bgCol, 3));

/* ========== 12. 开场动画 ========== */
function createOrb(color, size) {
    const group = new THREE.Group();

    const glow = new THREE.Sprite(new THREE.SpriteMaterial({
        map: starTex,
        color: color,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        transparent: true,
        opacity: 0.65,
    }));
    glow.scale.setScalar(size * 3.2);
    group.add(glow);

    const core = new THREE.Sprite(new THREE.SpriteMaterial({
        map: starTex,
        color: 0xffffff,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        transparent: true,
        opacity: 0.95,
    }));
    core.scale.setScalar(size);
    group.add(core);

    scene.add(group);
    return { group, glow, core };
}

const orb1 = createOrb(0x88ddff, 1.9);
const orb2 = createOrb(0xffffff, 1.9);
const orb3 = createOrb(0x88ddff, 1.9);
const orb4 = createOrb(0xffffff, 1.9);

function createTrail(color, length) {
    const geo = new THREE.BufferGeometry();
    const pos   = new Float32Array(length * 3);
    const alpha = new Float32Array(length);
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('aAlpha',   new THREE.BufferAttribute(alpha, 1));

    const mat = new THREE.ShaderMaterial({
        uniforms: {
            uColor:      { value: new THREE.Color(color) },
            uPixelRatio: { value: PR },
        },
        vertexShader: /* glsl */`
            attribute float aAlpha;
            varying float vAlpha;
            uniform float uPixelRatio;
            void main() {
                vAlpha = aAlpha;
                vec4 mv = modelViewMatrix * vec4(position, 1.0);
                gl_PointSize = 3.0 * uPixelRatio * aAlpha * (90.0 / -mv.z);
                gl_Position  = projectionMatrix * mv;
            }
        `,
        fragmentShader: /* glsl */`
            uniform vec3 uColor;
            varying float vAlpha;
            void main() {
                vec2 uv = gl_PointCoord - 0.5;
                float d = length(uv);
                if (d > 0.5) discard;
                float a = smoothstep(0.5, 0.0, d);
                gl_FragColor = vec4(uColor, a * vAlpha);
                #include <colorspace_fragment>
            }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
    });

    const points = new THREE.Points(geo, mat);
    points.frustumCulled = false;
    scene.add(points);

}

function computeSpiral(u, phase) {
    const angle = u * Math.PI * 3.5 + phase;
    const y = BASE_Y + 1.2 + u * (STAR_Y - BASE_Y - 2.4);
    const radius = (BASE_RADIUS + 5) * (1 - u * 0.82);
    return new THREE.Vector3(
        Math.cos(angle) * radius,
        y,
        Math.sin(angle) * radius
    );
}

function orbPosition(p, phase) {
    if (p < 0.2) {
        const t = p / 0.2;
        const ease = easeInOutQuad(t);
        const startR = 42;
        const startY = BASE_Y + 12;
        const start = new THREE.Vector3(
            Math.cos(phase) * startR,
            startY,
            Math.sin(phase) * startR
        );
        const enter = computeSpiral(0, phase);
        return start.lerp(enter, ease);
    } else if (p < 0.85) {
        const u = (p - 0.2) / 0.65;
        return computeSpiral(u, phase);
    } else {
        const t = (p - 0.85) / 0.15;
        const ease = easeInCubic(t);
        const end  = computeSpiral(1, phase);
        const star = new THREE.Vector3(0, STAR_Y, 0);
        return end.lerp(star, ease);
    }
}

function fillTrail(trail, pos) {
    for (let i = 0; i < trail.length; i++) {
        trail.pos[i*3]     = pos.x;
        trail.pos[i*3 + 1] = pos.y;
        trail.pos[i*3 + 2] = pos.z;
        trail.alpha[i] = 0;
    }
    trail.geo.attributes.position.needsUpdate = true;
    trail.geo.attributes.aAlpha.needsUpdate   = true;
}

function updateTrail(trail, newPos, intensity) {
    const pA = trail.pos;
    const aA = trail.alpha;
    const len = trail.length;

    for (let i = len - 1; i > 0; i--) {
        pA[i*3]     = pA[(i-1)*3];
        pA[i*3 + 1] = pA[(i-1)*3 + 1];
        pA[i*3 + 2] = pA[(i-1)*3 + 2];
    }
    pA[0] = newPos.x;
    pA[1] = newPos.y;
    pA[2] = newPos.z;

    for (let i = 0; i < len; i++) {
        const f = 1 - i / len;
        aA[i] = f * f * intensity;
    }

    trail.geo.attributes.position.needsUpdate = true;
    trail.geo.attributes.aAlpha.needsUpdate   = true;
}

fillTrail(trail1, orbPosition(0, 0));
fillTrail(trail2, orbPosition(0, Math.PI / 2));
fillTrail(trail3, orbPosition(0, Math.PI));
fillTrail(trail4, orbPosition(0, Math.PI * 1.5));

const INTRO_DURATION = 5.0;

const camTarget = new THREE.Vector3(0, 2.6, 0);
let camTheta  = 0.75;
let camPhi    = 1.32;
let camRadius = innerWidth < innerHeight ? 68 : 63;

const CAM_OFFSET_X = innerWidth < innerHeight ? 7 : 10;

const MIN_R = 15;
const MAX_R = 100;

function updateCamera() {
    const sp = Math.sin(camPhi);
    camera.position.set(
        camRadius * sp * Math.sin(camTheta) + CAM_OFFSET_X,
        camRadius * Math.cos(camPhi) + camTarget.y,
        camRadius * sp * Math.cos(camTheta)
    );
    camera.lookAt(camTarget);
}
updateCamera();

const dom = renderer.domElement;
const pointers = new Map();

let dragging   = false;
let lastPX = 0, lastPY = 0;
let pinchDist  = 0;
let autoRotate = true;
let spinVel    = 0;

dom.addEventListener('pointerdown', (e) => {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { dom.setPointerCapture(e.pointerId); } catch (err) {}
    if (pointers.size === 1) {
        dragging   = true;
        autoRotate = false;
        lastPX = e.clientX;
        lastPY = e.clientY;
        spinVel = 0;
    }
});

dom.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (pinchDist > 0) {
            camRadius += (pinchDist - d) * 0.12;
            camRadius = Math.max(MIN_R, Math.min(MAX_R, camRadius));
        }
        pinchDist = d;
        dragging = false;
    } else if (dragging) {
        const dx = e.clientX - lastPX;
        const dy = e.clientY - lastPY;
        lastPX = e.clientX;
        lastPY = e.clientY;

        camTheta -= dx * 0.0055;
        camPhi   -= dy * 0.0055;
        camPhi    = Math.max(0.45, Math.min(1.95, camPhi));
        spinVel   = -dx * 0.0055;
    }
});

function endPointer(e) {
    pointers.delete(e.pointerId);
    if (pointers.size === 0) {
        dragging   = false;
        pinchDist  = 0;
    } else if (pointers.size === 1) {
        const p = [...pointers.values()][0];
        lastPX = p.x;
        lastPY = p.y;
        dragging  = true;
        pinchDist = 0;
    }
}
dom.addEventListener('pointerup',     endPointer);

/* ========== 14. 开场更新 ========== */
function updateIntro(dt) {
    introProgress += dt / INTRO_DURATION;
    if (introProgress >= 1) {
        introProgress = 1;
        introComplete = true;
    }

    const p = introProgress;

    if (p < 0.2) {
        const t = p / 0.2;

        treeGroup.position.y = TRUNK_BOTTOM_Y * (1 - grow);
    } else {
        treeGroup.scale.setScalar(1);

    const orbP = p;
    const pos1 = orbPosition(orbP, 0);
    const pos2 = orbPosition(orbP, Math.PI / 2);
    const pos3 = orbPosition(orbP, Math.PI);
    const pos4 = orbPosition(orbP, Math.PI * 1.5);

    orb1.group.position.copy(pos1);
    orb2.group.position.copy(pos2);
    orb3.group.position.copy(pos3);
    orb4.group.position.copy(pos4);

    let trailIntensity = 1;
    if (p > 0.85) {
        trailIntensity = Math.max(0, 1 - (p - 0.85) / 0.15);
    }
    updateTrail(trail1, pos1, trailIntensity);
    updateTrail(trail2, pos2, trailIntensity);
    updateTrail(trail3, pos3, trailIntensity);

        orb3.core.material.opacity = 0.95 * inv;
        orb4.glow.material.opacity = 0.65 * inv;
        orb4.core.material.opacity = 0.95 * inv;

        const baseScale = 8 * (1 + burst);

    if (introComplete) {

        orb2.group.visible = false;
        orb3.group.visible = false;
        orb4.group.visible = false;
        trail1.points.visible = false;

        trail3.points.visible = false;
